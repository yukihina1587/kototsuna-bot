<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000015"/>
    </filter>
    <linearGradient id="emergency-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444"/>
      <stop offset="100%" style="stop-color:#DC2626"/>
    </linearGradient>
  </defs>

  <!-- Phone Frame -->
  <rect x="0" y="0" width="390" height="844" rx="40" fill="#F1F5F9"/>

  <!-- Status Bar -->
  <rect x="0" y="0" width="390" height="54" rx="40" fill="url(#header-grad)"/>
  <rect x="0" y="30" width="390" height="24" fill="url(#header-grad)"/>
  <text x="30" y="38" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="500">15:40</text>
  <text x="330" y="38" fill="white" font-family="system-ui, sans-serif" font-size="14">🔋 92%</text>

  <!-- Header -->
  <rect x="0" y="54" width="390" height="60" fill="url(#header-grad)"/>
  <text x="20" y="90" fill="white" font-family="system-ui, sans-serif" font-size="20" font-weight="700">🎙️ ことつな！管理画面</text>
  <circle cx="355" cy="84" r="16" fill="rgba(255,255,255,0.2)"/>
  <text x="349" y="89" fill="white" font-family="system-ui, sans-serif" font-size="16">🔔</text>

  <!-- Connection Status Card -->
  <rect x="16" y="130" width="358" height="70" rx="14" fill="white" filter="url(#card-shadow)"/>
  <circle cx="42" cy="157" r="8" fill="#22C55E"/>
  <circle cx="42" cy="157" r="8" fill="#22C55E" opacity="0.4">
    <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="58" y="153" fill="#1E293B" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Twitch 接続中</text>
  <text x="58" y="178" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">チャンネル: example_streamer</text>
  <rect x="280" y="145" width="76" height="28" rx="14" fill="#F0FDF4"/>
  <text x="293" y="164" fill="#16A34A" font-family="system-ui, sans-serif" font-size="12" font-weight="600">● LIVE</text>

  <!-- Stats Grid (2x2) -->
  <text x="20" y="228" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1">📊 翻訳統計</text>

  <!-- Stat Card 1: 翻訳数 -->
  <rect x="16" y="240" width="170" height="85" rx="14" fill="white" filter="url(#card-shadow)"/>
  <text x="32" y="266" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">翻訳リクエスト</text>
  <text x="32" y="302" fill="#6366F1" font-family="system-ui, sans-serif" font-size="32" font-weight="700">142</text>
  <text x="130" y="266" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="18">🔄</text>

  <!-- Stat Card 2: キャッシュ率 -->
  <rect x="204" y="240" width="170" height="85" rx="14" fill="white" filter="url(#card-shadow)"/>
  <text x="220" y="266" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">キャッシュ率</text>
  <text x="220" y="302" fill="#22C55E" font-family="system-ui, sans-serif" font-size="32" font-weight="700">85%</text>
  <text x="318" y="266" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="18">💾</text>

  <!-- Stat Card 3: エラー -->
  <rect x="16" y="340" width="170" height="85" rx="14" fill="white" filter="url(#card-shadow)"/>
  <text x="32" y="366" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">エラー数</text>
  <text x="32" y="402" fill="#EF4444" font-family="system-ui, sans-serif" font-size="32" font-weight="700">3</text>
  <text x="130" y="366" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="18">⚠️</text>

  <!-- Stat Card 4: DeepL -->
  <rect x="204" y="340" width="170" height="85" rx="14" fill="white" filter="url(#card-shadow)"/>
  <text x="220" y="366" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">DeepL 使用量</text>
  <text x="220" y="402" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="32" font-weight="700">12%</text>
  <text x="318" y="366" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="18">📝</text>

  <!-- TTS Control Section -->
  <text x="20" y="460" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1">🔊 TTS コントロール</text>

  <rect x="16" y="472" width="358" height="120" rx="14" fill="white" filter="url(#card-shadow)"/>

  <!-- TTS Toggle -->
  <text x="32" y="502" fill="#1E293B" font-family="system-ui, sans-serif" font-size="15" font-weight="500">読み上げ</text>
  <rect x="300" y="486" width="52" height="28" rx="14" fill="#6366F1"/>
  <circle cx="338" cy="500" r="11" fill="white"/>
  <text x="32" y="522" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">キュー: 3件待ち</text>

  <!-- TTS Buttons Row -->
  <rect x="32" y="540" width="150" height="38" rx="10" fill="#EEF2FF"/>
  <text x="62" y="564" fill="#6366F1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">⏭ スキップ</text>

  <rect x="198" y="540" width="160" height="38" rx="10" fill="#FEF2F2"/>
  <text x="218" y="564" fill="#EF4444" font-family="system-ui, sans-serif" font-size="14" font-weight="600">🗑️ キュークリア</text>

  <!-- Emergency Stop Button -->
  <rect x="16" y="612" width="358" height="60" rx="16" fill="url(#emergency-grad)" filter="url(#card-shadow)"/>
  <text x="130" y="648" fill="white" font-family="system-ui, sans-serif" font-size="18" font-weight="700">🛑 緊急停止</text>

  <!-- Recent Chat Preview -->
  <text x="20" y="706" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1">💬 最新チャット</text>

  <rect x="16" y="716" width="358" height="58" rx="14" fill="white" filter="url(#card-shadow)"/>
  <text x="32" y="740" fill="#6366F1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">user123</text>
  <text x="100" y="740" fill="#1E293B" font-family="system-ui, sans-serif" font-size="13">Hello everyone!</text>
  <text x="32" y="760" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">→ みなさん、こんにちは！</text>

  <!-- Bottom Navigation -->
  <rect x="0" y="790" width="390" height="54" rx="0" fill="white"/>
  <line x1="0" y1="790" x2="390" y2="790" stroke="#E2E8F0" stroke-width="1"/>

  <rect x="28" y="794" width="80" height="44" rx="10" fill="#EEF2FF"/>
  <text x="44" y="814" fill="#6366F1" font-family="system-ui, sans-serif" font-size="18">📊</text>
  <text x="32" y="832" fill="#6366F1" font-family="system-ui, sans-serif" font-size="10" font-weight="600">ダッシュボード</text>

  <text x="175" y="814" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="18">💬</text>
  <text x="157" y="832" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">チャットログ</text>

  <text x="305" y="814" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="18">⚙️</text>
  <text x="302" y="832" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">設定</text>
</svg>
