<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="header-grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <filter id="card-shadow3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="0" y="0" width="390" height="844" rx="40" fill="#F1F5F9"/>

  <!-- Status Bar -->
  <rect x="0" y="0" width="390" height="54" rx="40" fill="url(#header-grad3)"/>
  <rect x="0" y="30" width="390" height="24" fill="url(#header-grad3)"/>
  <text x="30" y="38" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="500">15:40</text>
  <text x="330" y="38" fill="white" font-family="system-ui, sans-serif" font-size="14">🔋 92%</text>

  <!-- Header -->
  <rect x="0" y="54" width="390" height="60" fill="url(#header-grad3)"/>
  <text x="20" y="90" fill="white" font-family="system-ui, sans-serif" font-size="20" font-weight="700">⚙️ 設定</text>

  <!-- Section: 接続設定 -->
  <text x="20" y="140" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1">接続設定</text>

  <rect x="16" y="152" width="358" height="130" rx="14" fill="white" filter="url(#card-shadow3)"/>

  <!-- モバイル管理画面 ON/OFF -->
  <text x="32" y="180" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="500">モバイル管理画面</text>
  <text x="32" y="198" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">LAN内からの管理アクセスを許可</text>
  <rect x="300" y="170" width="52" height="28" rx="14" fill="#6366F1"/>
  <circle cx="338" cy="184" r="11" fill="white"/>

  <line x1="32" y1="212" x2="358" y2="212" stroke="#F1F5F9" stroke-width="1"/>

  <!-- パスワード保護 -->
  <text x="32" y="236" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="500">パスワード保護</text>
  <text x="32" y="254" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">アクセス時にパスワードを要求</text>
  <rect x="300" y="226" width="52" height="28" rx="14" fill="#6366F1"/>
  <circle cx="338" cy="240" r="11" fill="white"/>

  <line x1="32" y1="268" x2="358" y2="268" stroke="#F1F5F9" stroke-width="1"/>

  <!-- パスワード入力 -->
  <text x="32" y="266" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11"></text>

  <!-- Section: セキュリティ -->
  <text x="20" y="312" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1">🔒 セキュリティ</text>

  <rect x="16" y="324" width="358" height="180" rx="14" fill="white" filter="url(#card-shadow3)"/>

  <!-- アクセスパスワード -->
  <text x="32" y="354" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="500">アクセスパスワード</text>
  <rect x="32" y="364" width="326" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="44" y="387" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">••••••••</text>
  <text x="320" y="387" fill="#6366F1" font-family="system-ui, sans-serif" font-size="12">👁</text>

  <!-- アクセス制限 -->
  <text x="32" y="424" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="500">アクセス制限</text>
  <rect x="32" y="434" width="326" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="44" y="457" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">LAN内のみ（推奨）</text>
  <text x="330" y="457" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">▼</text>

  <!-- ポート番号 -->
  <text x="32" y="490" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="500">ポート番号</text>
  <text x="240" y="490" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">8080（自動割当）</text>

  <!-- Section: 表示設定 -->
  <text x="20" y="534" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1">🎨 表示設定</text>

  <rect x="16" y="546" width="358" height="130" rx="14" fill="white" filter="url(#card-shadow3)"/>

  <!-- チャット表示件数 -->
  <text x="32" y="576" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="500">チャット表示件数</text>
  <text x="300" y="576" fill="#64748B" font-family="system-ui, sans-serif" font-size="14">20件</text>
  <text x="340" y="576" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">▼</text>

  <line x1="32" y1="592" x2="358" y2="592" stroke="#F1F5F9" stroke-width="1"/>

  <!-- 自動更新間隔 -->
  <text x="32" y="616" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="500">自動更新間隔</text>
  <text x="280" y="616" fill="#64748B" font-family="system-ui, sans-serif" font-size="14">1.2秒</text>
  <text x="330" y="616" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">▼</text>

  <line x1="32" y1="632" x2="358" y2="632" stroke="#F1F5F9" stroke-width="1"/>

  <!-- 特別イベント通知 -->
  <text x="32" y="660" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="500">特別イベント通知</text>
  <rect x="300" y="644" width="52" height="28" rx="14" fill="#6366F1"/>
  <circle cx="338" cy="658" r="11" fill="white"/>

  <!-- Info box -->
  <rect x="16" y="696" width="358" height="70" rx="14" fill="#EEF2FF"/>
  <text x="32" y="722" fill="#6366F1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ℹ️ アクセス方法</text>
  <text x="32" y="742" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">同じWi-Fiに接続したスマホから</text>
  <text x="32" y="758" fill="#6366F1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">http://192.168.1.10:8080/admin</text>

  <!-- Bottom Navigation -->
  <rect x="0" y="790" width="390" height="54" rx="0" fill="white"/>
  <line x1="0" y1="790" x2="390" y2="790" stroke="#E2E8F0" stroke-width="1"/>

  <text x="44" y="814" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="18">📊</text>
  <text x="32" y="832" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">ダッシュボード</text>

  <text x="175" y="814" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="18">💬</text>
  <text x="157" y="832" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">チャットログ</text>

  <rect x="278" y="794" width="64" height="44" rx="10" fill="#EEF2FF"/>
  <text x="305" y="814" fill="#6366F1" font-family="system-ui, sans-serif" font-size="18">⚙️</text>
  <text x="296" y="832" fill="#6366F1" font-family="system-ui, sans-serif" font-size="10" font-weight="600">設定</text>
</svg>
