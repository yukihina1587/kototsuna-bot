name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Download STT models
        run: |
          Write-Host "Downloading ReazonSpeech-k2-v2 model package from GitHub Releases..."
          New-Item -ItemType Directory -Path "models/reazonspeech" -Force

          $tarUrl = "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-zipformer-ja-reazonspeech-2024-08-01.tar.bz2"
          $tarFile = "$env:TEMP\reazonspeech.tar.bz2"
          Invoke-WebRequest -Uri $tarUrl -OutFile $tarFile -UseBasicParsing
          $tarSize = (Get-Item $tarFile).Length / 1MB
          Write-Host "  Downloaded: $([math]::Round($tarSize, 2)) MB"

          Write-Host "Extracting model files..."
          tar -xjf $tarFile -C "$env:TEMP"
          $extractDir = "$env:TEMP\sherpa-onnx-zipformer-ja-reazonspeech-2024-08-01"
          $needed = @(
            "encoder-epoch-99-avg-1.int8.onnx",
            "decoder-epoch-99-avg-1.int8.onnx",
            "joiner-epoch-99-avg-1.int8.onnx",
            "tokens.txt"
          )
          foreach ($f in $needed) {
            Copy-Item "$extractDir\$f" "models\reazonspeech\$f"
            $size = (Get-Item "models\reazonspeech\$f").Length / 1MB
            Write-Host "  $f ($([math]::Round($size, 2)) MB)"
          }
          Remove-Item $tarFile -Force
          Remove-Item $extractDir -Recurse -Force

          Write-Host "Downloading Silero VAD model..."
          $vadUrl = "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx"
          Invoke-WebRequest -Uri $vadUrl -OutFile "models/silero_vad.onnx" -UseBasicParsing
          $vadSize = (Get-Item "models/silero_vad.onnx").Length / 1MB
          Write-Host "  -> $([math]::Round($vadSize, 2)) MB"

          Write-Host "All STT models downloaded successfully."
        shell: pwsh

      - name: Download NLLB-200 translation model
        run: |
          Write-Host "Downloading NLLB-200-distilled-600M (CTranslate2 INT8) from HuggingFace..."
          pip install huggingface_hub
          python download_translation_models.py

          $modelDir = "models/nllb-200-distilled-600M-ct2-int8"
          if (!(Test-Path "$modelDir/model.bin")) {
            Write-Error "NLLB-200 model download failed: model.bin not found"
            exit 1
          }
          $size = (Get-Item "$modelDir/model.bin").Length / 1MB
          Write-Host "  model.bin ($([math]::Round($size, 2)) MB)"
          $spmSize = (Get-Item "$modelDir/sentencepiece.bpe.model").Length / 1MB
          Write-Host "  sentencepiece.bpe.model ($([math]::Round($spmSize, 2)) MB)"
          Write-Host "NLLB-200 translation model downloaded successfully."
        shell: pwsh

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean Kototsuna.spec

      - name: Verify build output
        run: |
          if (!(Test-Path "dist/Kototsuna/Kototsuna.exe")) {
            Write-Error "Build failed: dist/Kototsuna/Kototsuna.exe not found"
            exit 1
          }
          $size = (Get-Item "dist/Kototsuna/Kototsuna.exe").Length / 1MB
          Write-Host "Build successful: Kototsuna.exe ($([math]::Round($size, 2)) MB)"
        shell: pwsh

      - name: Inspect Tcl/Tk files (non-blocking)
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP "verify_tcl.py"
          @"
          import glob

          matches = glob.glob('build/**/init.tcl', recursive=True)
          print(f'init.tcl found in build: {len(matches)} files')
          for m in matches[:5]:
              print(f'  {m}')

          candidates = (
              glob.glob('build/**/_tcl_data/init.tcl', recursive=True)
              + glob.glob('build/**/_internal/_tcl_data/init.tcl', recursive=True)
              + glob.glob('dist/Kototsuna/_internal/_tcl_data/init.tcl', recursive=True)
              + glob.glob('dist/Kototsuna/_internal/**/init.tcl', recursive=True)
          )
          print(f'init.tcl in known Tcl data paths: {len(candidates)} files')
          for m in candidates[:5]:
              print(f'  {m}')

          if not candidates:
              print('WARNING: init.tcl not found in checked paths.')
              print('This can happen with onefile layout changes; build is not failed by this check.')
          "@ | Set-Content -Path $scriptPath -Encoding UTF8
          python $scriptPath
        shell: pwsh

      - name: Build installer with Inno Setup
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Write-Host "Building installer for version: $version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version installer.iss
          if (!(Test-Path "installer_output/Kototsuna_Setup.exe")) {
            Write-Error "Inno Setup build failed: Kototsuna_Setup.exe not found"
            exit 1
          }
          $size = (Get-Item "installer_output/Kototsuna_Setup.exe").Length / 1MB
          Write-Host "Installer built: Kototsuna_Setup.exe ($([math]::Round($size, 2)) MB)"
        shell: pwsh

      - name: Calculate SHA256 hash
        id: hash
        run: |
          $hash = (Get-FileHash -Path "installer_output/Kototsuna_Setup.exe" -Algorithm SHA256).Hash
          Write-Host "SHA256: $hash"
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        shell: pwsh

      - name: Determine prerelease
        id: prerelease
        run: |
          $tag = "${{ github.ref_name }}"
          $isPrerelease = $tag -match '-(alpha|beta|rc)'
          if ($isPrerelease) { $val = "true" } else { $val = "false" }
          "is_prerelease=$val" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Tag: $tag, Prerelease: $isPrerelease"
        shell: pwsh

      - name: Extract changelog for this version
        id: changelog
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $content = Get-Content "CHANGELOG.md" -Raw -Encoding UTF8

          # Extract section between ## [version] and next ## [
          $escaped = [regex]::Escape($version)
          $pattern = "(?s)## \[$escaped\].*?(?=\n## \[|\z)"
          if ($content -match $pattern) {
            $section = $Matches[0].Trim()
          } else {
            $section = "変更内容は [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) を参照してください。"
          }

          # Write release notes file
          $notes = @"
$section

---

📥 **インストール方法**: ``Kototsuna_Setup.exe`` をダウンロードして実行してください。

<details><summary>🔒 SHA256（ファイル整合性確認用）</summary>

``````
${{ steps.hash.outputs.sha256 }}  Kototsuna_Setup.exe
``````

</details>
"@
          $notes | Out-File -FilePath "release_notes.md" -Encoding UTF8
          Write-Host "Release notes generated for v$version"
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/Kototsuna_Setup.exe
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
          body_path: release_notes.md
