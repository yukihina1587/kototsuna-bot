name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: uv pip install --system -r requirements-ci.txt

      - name: Run tests
        run: |
          pytest tests/ -v --ignore=tests/test_tts.py --ignore=tests/test_bot.py
        env:
          PYTHONPATH: ${{ github.workspace }}
