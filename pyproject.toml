[project]
name = "translation-bot"
version = "1.5.2-beta.7"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Twitch Chat Integration
    "twitchio>=2.9.0,<3.0.0",
    # HTTP Requests
    "requests>=2.31.0,<3.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "obsws-python>=1.7.0,<2.0.0",
    # Retry with exponential backoff
    "tenacity>=8.2.0",
    # Environment Variables
    "python-dotenv>=1.2.1,<2.0.0",
    # GUI Framework
    "customtkinter>=5.2.2,<6.0.0",
    "pillow>=12.1.0",
    # Voice Recognition (Local STT: sherpa-onnx + ReazonSpeech-k2-v2)
    "sherpa-onnx>=1.12.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    # Text-to-Speech (VOICEVOX + Fallback)
    "pygame>=2.5.0",
    "pyttsx3>=2.90",
    # Resource Monitoring
    "psutil>=5.9.0,<6.0.0",
    # Local Translation (CTranslate2 + NLLB-200)
    "ctranslate2>=4.0.0",
    "sentencepiece>=0.1.99",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
