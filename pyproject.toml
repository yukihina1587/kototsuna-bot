[project]
name = "translation-bot"
version = "1.6.3-beta.7"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2.2",
    "pillow>=12.1.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
# ローカル音声認識（ReazonSpeech + Silero VAD）に必要なパッケージ
# uv sync で自動インストールされる（optional-dependencies は uv sync では入らない）
stt = [
    "numpy>=1.24",
    "sounddevice>=0.4",
    "sherpa-onnx>=1.12",
    "sherpa-onnx-core>=1.12",
    "onnxruntime>=1.23.2,<1.24",
]
